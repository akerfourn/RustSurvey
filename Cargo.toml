[workspace]
members = ["crates/domain", "crates/limesurvey", "crates/migration", "crates/object-store", "crates/server"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
dotenvy = { version = "0.15.7", default-features = false }
getrandom = "0.4.3"
http-body = "1.0.1"
http-body-util = "0.1.5"
quick-xml = { version = "0.42.0", default-features = false }
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.29.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
