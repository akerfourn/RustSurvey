[workspace]
members = ["crates/limesurvey", "crates/migration", "crates/server"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
quick-xml = { version = "0.42.0", default-features = false }
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
