[package]
name = "rustsurvey-server"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["db-sqlite"]
db-mariadb = ["sea-orm/sqlx-mysql", "sea-orm/runtime-tokio-rustls", "rustsurvey-migration/db-mariadb"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm/runtime-tokio-rustls", "rustsurvey-migration/db-postgres"]
db-sqlite = ["sea-orm/sqlx-sqlite", "rustsurvey-migration/db-sqlite"]

[dependencies]
argon2.workspace = true
axum.workspace = true
dotenvy.workspace = true
getrandom.workspace = true
http-body.workspace = true
http-body-util.workspace = true
rustsurvey-domain = { path = "../domain" }
rustsurvey-limesurvey = { path = "../limesurvey" }
rustsurvey-migration = { path = "../migration", default-features = false }
rustsurvey-object-store = { path = "../object-store" }
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
